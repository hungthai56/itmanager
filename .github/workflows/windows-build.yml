name: Windows build and test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main, master]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify storage
        run: npm test
      - name: TypeScript and Vite
        run: npm run build
      - name: Package Windows installer
        shell: pwsh
        run: |
          # Electron-builder fetches NSIS from GitHub releases; temporary HTTP 504s
          # must not fail the entire release on the first attempt.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "NSIS package attempt $attempt / 3"
            npx electron-builder --win nsis --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 12 }
          }
          exit 1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-IT-Command-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
